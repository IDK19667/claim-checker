# Render blueprint. With this file in the repo, Render reads the whole
# service definition instead of asking you to fill in a form.
#
# One deliberate choice worth knowing: `disk` is commented out. A free
# instance has an ephemeral filesystem, so the SQLite cache is wiped on every
# restart and redeploy. That is survivable (the app just re-checks claims and
# the front page refills) and it keeps the cost at zero. Uncomment the disk,
# on a paid instance, when losing the cache starts to matter.

services:
  - type: web
    name: claim-checker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      # Set this in the Render dashboard, never in this file.
      - key: GEMINI_API_KEY
        sync: false
      # Rate limiting must see the visitor's IP, not Render's proxy.
      - key: TRUST_PROXY
        value: "1"
      # Share links, OG cards and the ClaimReview markup need the real origin.
      # Set it to your Render URL, then to your domain if you add one.
      - key: PUBLIC_URL
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      - key: NCBI_EMAIL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"

    # A cache that outlives restarts. Needs a paid instance.
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and then set DB_PATH=/var/data/health_claim_checker.db
