# Render blueprint. With this file in the repo, Render reads the whole
# service definition instead of asking you to fill in a form.
#
# One deliberate choice worth knowing: `disk` is commented out. A free
# instance has an ephemeral filesystem, so the local SQLite file is wiped on
# every restart and redeploy. The saved answers, check log and feedback live
# in Turso instead (TURSO_* below), which is free and needs no disk. Without
# those two variables the app falls back to the local file, which still
# works but forgets everything on restart.

services:
  - type: web
    name: evident
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      # Set this in the Render dashboard, never in this file.
      - key: GEMINI_API_KEY
        sync: false
      # Rate limiting must see the visitor's IP, not Render's proxy.
      - key: TRUST_PROXY
        value: "1"
      # Share links, OG cards and the ClaimReview markup need the real origin.
      # Set it to your Render URL, then to your domain if you add one.
      - key: PUBLIC_URL
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      # Signs Flask's session cookie. Nothing in the app uses a session or a
      # flash message today, so this is hygiene and not a fix: Render makes
      # the value itself, so it never exists in the repo or in a dashboard
      # field anyone has to handle.
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Permanent storage (Turso). Set both in the dashboard, never in this
      # file. If either is missing the app uses the local SQLite file.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: NCBI_EMAIL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"

    # A local file that outlives restarts. Needs a paid instance; Turso above
    # does this job for free.
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and then set DB_PATH=/var/data/health_claim_checker.db
