# Keeps checkevident.com awake.
#
# Render's free plan puts the site to sleep after 15 minutes without a
# visitor, and the next person then waits up to a minute for it to wake.
# This visits the health check every 10 minutes so it never goes idle.
#
# GitHub runs scheduled jobs on a best-effort basis: a run can start late
# when GitHub is busy, so the site may still sleep now and then. GitHub also
# pauses schedules after 60 days with no commits; it emails a link to turn
# this back on. Run it by hand from the Actions tab at any time.
#
# Staying awake all month uses about 744 of the free plan's 750 instance
# hours, which fits only while this is the one free service on the account.
# On a paid instance this file does nothing useful and can be deleted.
name: Keep the site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the health check
        run: curl --silent --show-error --fail --retry 3 --retry-delay 10 --max-time 90 https://checkevident.com/healthz
